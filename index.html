<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雑記帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Klee+One:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="blog.css?v=5">
</head>
<body>
<div class="leaves" id="leaves" aria-hidden="true"></div>
<main>
  <section><div class="wrap wide">
    <h2 class="sec" data-en="Journal">雑記</h2>
    <input class="search" id="q" type="search" placeholder="記事を検索" aria-label="記事を検索" autocomplete="off">
    <div class="contents" id="list"></div>
    <nav class="pager" id="pager" aria-label="ページ送り"></nav>
  </div></section>
</main>
<script src="blog.js?v=5"></script>
<script>
chrome(true);
const box=document.getElementById("list");

// 落ち葉（控えめに）
if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
  const L=document.getElementById("leaves");
  for(let i=0;i<9;i++){const l=document.createElement("span");l.className="leaf";l.textContent=i%2?"🍂":"🍁";
    l.style.cssText=`left:${Math.random()*100}%;--dx:${(Math.random()*160-80)|0}px;--rot:${(Math.random()*540-270)|0}deg;animation-duration:${14+Math.random()*12}s;animation-delay:${-Math.random()*20}s;font-size:${14+Math.random()*14}px`;
    L.append(l)}
}

// 初回のみ下からフェードイン
function reveal(els){
  document.documentElement.classList.add("js");
  els.forEach((e,i)=>{e.classList.add("rv");e.style.setProperty("--d",((i%4)*.1).toFixed(2)+"s")});
  if(!("IntersectionObserver" in window)){els.forEach(e=>e.classList.add("in"));return}
  const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.12,rootMargin:"0px 0px -4% 0px"});
  els.forEach(e=>io.observe(e));
}

let ALL=[],first=true;
const PER=13, pager=document.getElementById("pager");   // 1ページに13件（大1＋4＋4＋4）
const norm=s=>s.toLowerCase();
const nameOf=p=>p.slug.replace(/^\d{4}-\d{2}-\d{2}-?/,"");   // ファイル名の日付より後ろ
const pageNo=()=>{const m=location.hash.match(/^#p(\d+)$/);return m?+m[1]:1};
const card=(p,big)=>`<a class="note${big?" big":""}" href="post.html?p=${encodeURIComponent(p.slug)}">
  <div class="mt"><time>${fmt(p.date)}</time><span>No.${noOf(ALL,p)}</span></div>
  <div class="ph">${(p.thumb||SITE.thumb)?`<img src="${esc(p.thumb||SITE.thumb)}" alt="" loading="lazy" onerror="if(this.dataset.f){this.parentNode.textContent='🍁'}else{this.dataset.f=1;this.src=SITE.thumb}">`:"🍁"}</div>
  <h3>${esc(p.title)}</h3><p>${esc(p.excerpt)}</p></a>`;
function pagerHtml(pg,n){
  const a=(i,t)=>`<a href="#p${i}">${t}</a>`;
  let h=pg>1?a(pg-1,"← 新しい記事"):'<span class="dis">← 新しい記事</span>',last=0;
  const show=new Set([1,n,pg-1,pg,pg+1]);
  for(let i=1;i<=n;i++){if(!show.has(i))continue;if(i-last>1)h+='<span class="dots">…</span>';h+=i===pg?`<span class="cur">${i}</span>`:a(i,i);last=i}
  return h+(pg<n?a(pg+1,"古い記事 →"):'<span class="dis">古い記事 →</span>');
}
function draw(){
  const q=norm(document.getElementById("q").value.trim());
  // 検索していないときは hidden の記事を出さない。検索したときは、題名・冒頭・ファイル名に一致したものだけ出す
  const all=ALL.filter(p=>q?norm(p.title+" "+p.excerpt+" "+nameOf(p)).includes(q):!p.hidden);
  if(!all.length){box.innerHTML=`<p class="empty" style="grid-column:1/-1">${q?"見つかりませんでした。":"まだ記事がありません。"}</p>`;pager.innerHTML="";return}
  const n=Math.ceil(all.length/PER), pg=Math.min(Math.max(pageNo(),1),n);
  box.innerHTML=all.slice((pg-1)*PER,pg*PER).map((p,i)=>card(p,i===0)).join("");   // 新しい順。先頭の1件だけ大きく
  pager.innerHTML=n>1?pagerHtml(pg,n):"";
  if(first){first=false;reveal([document.querySelector("h2.sec"),...box.querySelectorAll(".note")])}
}
getPosts().then(ps=>{ALL=ps;draw();
  document.getElementById("q").addEventListener("input",()=>{if(location.hash)history.replaceState(null,"",location.pathname+location.search);draw()});
  addEventListener("hashchange",()=>{draw();scrollTo({top:0,behavior:"smooth"})});
}).catch(()=>{box.innerHTML='<p class="empty">記事一覧（posts.json）を読み込めませんでした。make_posts.py を実行したか確認してください。</p>'});
</script>
</body>
</html>
