<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>記事エディタ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Serif+JP:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<!-- CSS/JSは読み込むたびに時刻の印（?v=）をつけて、更新が古いキャッシュに邪魔されないようにしている -->
<script>document.write('<link rel="stylesheet" href="blog.css?v='+Date.now()+'">')</script>
<style>
:root{--bar:calc(68px + env(safe-area-inset-bottom,0px))}
body{padding-bottom:var(--bar);font-size:16px}
.ed{max-width:820px;margin:0 auto;padding:12px 14px 24px}
.ed h1{margin:6px 0 10px;font-family:"Playfair Display","Noto Serif JP",serif;font-size:1.5rem;color:var(--deep)}
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:6px;padding:8px 0;background:#fbf3e6ee;backdrop-filter:blur(6px)}
.tabs button{flex:1;padding:10px 4px;font:inherit;font-weight:600;color:var(--deep);background:#fffaf0;border:1px solid var(--gilt);border-radius:8px 8px 0 0;cursor:pointer}
.tabs button.on{color:#fff;background:linear-gradient(var(--maple),var(--deep))}
.tabs .gear{flex:none;width:46px}
.pane{display:none}.pane.on{display:block}
.f{margin:0 0 14px}
.f>label{display:block;margin:0 0 4px;font-family:"Klee One","Noto Serif JP",serif;font-weight:600;color:var(--deep)}
.f small{display:block;margin-top:3px;color:var(--sub);font-size:.8rem;line-height:1.6}
.f input,.f select,.f textarea{display:block;width:100%;box-sizing:border-box;padding:11px 12px;font:inherit;font-size:16px;color:var(--ink);background:#fffdf7;border:1px solid var(--gilt);border-radius:6px}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--maple);outline-offset:1px}
.f textarea{min-height:46vh;line-height:1.9;resize:vertical;font-family:"Klee One","Noto Serif JP",serif}
.row{display:flex;gap:8px;align-items:stretch}.row>*{min-width:0}.row .grow{flex:1}
.mini{flex:none;padding:0 14px;font:inherit;font-weight:600;color:var(--deep);background:#f0dcae;border:1px solid var(--gilt);border-radius:6px;cursor:pointer;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{padding:3px 12px;font:inherit;font-size:.85rem;color:var(--deep);background:#fffaf0;border:1px solid var(--gilt);border-radius:999px;cursor:pointer}
.tool{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;margin:0 -14px;padding-inline:14px;-webkit-overflow-scrolling:touch}
.tool button{flex:none;padding:9px 13px;font:inherit;font-size:.92rem;font-weight:600;color:var(--deep);background:#f0dcae;border:1px solid var(--gilt);border-radius:8px;cursor:pointer}
.warn{margin:4px 0 12px;color:var(--maple);font-size:.85rem;line-height:1.6}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:#fbf3e6f2;backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.bar button{flex:1;padding:13px 6px;font:inherit;font-weight:700;font-size:1rem;color:var(--deep);background:#fffaf0;border:2px solid var(--gilt);border-radius:10px;cursor:pointer}
.bar button.main{flex:1.6;color:#fff;background:linear-gradient(var(--maple),var(--deep))}
.bar button:disabled{opacity:.55}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;margin:0 0 8px;padding:11px 14px;background:#fffaf0;border:1px solid #ecdcb9;border-radius:8px;cursor:pointer}
.list time{flex:none;color:var(--sub);font-size:.82rem}.list b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--deep)}
.card{padding:16px;margin:0 0 14px;background:#fffaf0;border:1px solid #ecdcb9;border-radius:8px;line-height:1.9;font-size:.92rem}
.toast{position:fixed;left:50%;bottom:calc(var(--bar) + 12px);z-index:40;max-width:92vw;transform:translateX(-50%);padding:10px 16px;color:#fff;background:#43261ae6;border-radius:10px;font-size:.92rem;line-height:1.7}
.toast.err{background:#a8321ce6}.toast a{color:#ffe2a8}
.pv .sheet{margin-top:8px}
.danger{color:var(--maple)!important}
dialog{border:0}
</style>
</head>
<body>
<div class="ed">
  <h1>記事エディタ</h1>
  <div class="tabs" id="tabs">
    <button data-p="write" class="on">書く</button><button data-p="pv">プレビュー</button><button data-p="list">記事一覧</button><button class="gear" data-p="set" aria-label="設定">⚙</button>
  </div>

  <section class="pane on" id="p-write">
    <p class="warn" id="draftNote" hidden></p>
    <div class="f"><label for="t">題名</label><input id="t" autocomplete="off"></div>
    <div class="f"><label for="d">日付</label>
      <div class="row"><input id="d" type="date" class="grow"><button class="mini" id="today" type="button">今日</button></div></div>
    <div class="f"><label for="s">ファイル名</label><input id="s" autocomplete="off" autocapitalize="off">
      <small id="shint">日付のあとに付く名前です（記事のURLになります）</small></div>
    <div class="f"><label for="g">タグ</label><input id="g" autocomplete="off" placeholder="日常, 音楽">
      <div class="chips" id="gchips"></div><small>「お知らせ」は一覧の一番左、「その他」は一番右に並びます</small></div>
    <div class="f"><label for="a">著者</label><input id="a" list="alist" autocomplete="off"><datalist id="alist"></datalist></div>
    <div class="f"><label for="m">概要</label><input id="m" autocomplete="off"><small>左上の大きいカードに出ます。小さいカードには「追記」と書いたときだけ出ます</small></div>
    <div class="f"><label for="th">サムネ</label>
      <div class="row"><input id="th" class="grow" autocomplete="off" placeholder="images/… または https://…"><button class="mini" id="thPick" type="button">写真を選ぶ</button></div></div>
    <div class="f"><label for="b">本文</label>
      <div class="tool" id="tool"></div>
      <textarea id="b" placeholder="ここに本文を書きます"></textarea></div>
  </section>

  <section class="pane pv" id="p-pv"><div id="pvBox"></div></section>

  <section class="pane" id="p-list">
    <div class="row" style="margin-bottom:10px"><button class="mini grow" id="newBtn" type="button" style="padding:12px">＋ 新しい記事を書く</button><button class="mini" id="reload" type="button">更新</button></div>
    <ul class="list" id="plist"></ul>
  </section>

  <section class="pane" id="p-set">
    <div class="card">GitHubに記事を送るための設定です。<b>この端末のブラウザだけ</b>に保存されます。</div>
    <div class="f"><label for="cr">リポジトリ（ユーザー名/リポジトリ名）</label><input id="cr" autocapitalize="off" autocomplete="off" placeholder="0t0784/blog"></div>
    <div class="f"><label for="cb">ブランチ</label><input id="cb" autocapitalize="off" value="main"></div>
    <div class="f"><label for="ct">トークン（Fine-grained personal access token）</label><input id="ct" type="password" autocapitalize="off" autocomplete="off" placeholder="github_pat_…">
      <small>このブログのリポジトリだけに、Contents（Read and write）の権限をつけたものを使ってください</small></div>
    <div class="row"><button class="mini grow" id="cs" type="button" style="padding:12px">保存して接続テスト</button><button class="mini danger" id="cx" type="button">トークンを消す</button></div>
    <p class="card" id="cres" style="margin-top:12px" hidden></p>
    <div class="f" style="margin-top:14px"><label style="display:flex;gap:8px;align-items:center;font-weight:400"><input id="cz" type="checkbox" checked style="width:auto"> 写真を自動で小さくする（長い辺1600px・JPEG）</label></div>
  </section>
</div>
<div class="bar"><button id="pvBtn" type="button">プレビュー</button><button id="pub" class="main" type="button">公開する</button></div>
<script>document.write('<script src="blog.js?v='+Date.now()+'"><\/script><script src="editor.js?v='+Date.now()+'"><\/script>')</script>
</body>
</html>
